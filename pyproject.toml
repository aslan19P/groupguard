[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "groupguard"
version = "0.1.0"
description = "Universal Telegram group moderation bot"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiogram==3.28.2",
  "alembic==1.16.5",
  "greenlet==3.2.4",
  "ImageHash==4.3.2",
  "Pillow==11.3.0",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "rapidfuzz==3.14.1",
  "SQLAlchemy==2.0.43",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.12",
]

[project.scripts]
groupguard = "groupguard.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["groupguard"]
